# Daily logical backup of the production Supabase database.
# The free Supabase plan keeps no backups, so this is the safety net.
#
# Setup (once): GitHub → Settings → Secrets and variables → Actions →
#   SUPABASE_DB_URL  = the *session pooler* connection string
#                      (Supabase → Connect → Session pooler, port 5432)
#   BACKUP_PASSPHRASE = a long random passphrase (keep a copy offline!)
#
# Dumps are encrypted with the passphrase before upload, because this
# repository is public and workflow artifacts are visible to anyone with
# read access. Restore:
#   gpg -d gndsf-YYYY-MM-DD.dump.gpg > db.dump && pg_restore -d "$URL" db.dump
name: DB backup

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL" && test -n "$BACKUP_PASSPHRASE"
          f="gndsf-$(date -u +%F).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges --schema=public -f "$f"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
          rm "$f"
          echo "FILE=$f.gpg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
